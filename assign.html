<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        header{
            background-color: cyan;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family:'Times New Roman', Times, serif;
            font-size: 30px;
            height: 70px;
            width: auto;
            border-style: dotted;
        }
        nav{
            color: white;
            background-color: rgb(99, 65, 21);
            display: grid;
            place-items: center;
            font-family:'Times New Roman', Times, serif;
            font-size: 30px;
            height: 70px;
            width: auto;
            border-style: solid;
            border-color: black;

        }
        
        section{
            color: white;
            background-color: deeppink;
            display: grid;
            place-items: center;
            font-family:'Times New Roman', Times, serif;
            font-size: 50px;
            height: 250px;
            width: 60%;
            border-style: inset;
            border-color:black;

        }
        article{
            background-color: forestgreen;
            display: grid;
            place-items: center;
            font-family:'Times New Roman', Times, serif;
            font-size: 50px;
            height: 270px;
            width: 60%;
            border-style: double;
            border-color:black;


        }
        aside{
            font-size: 40px;
            display: grid;
            place-items: center;
            height: 510px;
            width: 30%;
            float: right;
            background: cyan;
            padding: 10px;
            border-style: solid;
            border-color:black;
            margin-top: -550px; 
            margin-right: 20px; 
        }
        footer{
            height: 50px;
            width: 100%;
            background-color: grey;
            display: grid;
            place-items: center;
            border: solid;
            font-size: 20px;

            
        }


    </style>
</head>
<body>
<header>Header</header><br>
<nav>Nav</nav><br>
<section>Section</section><br>
<article>Article</article><br>
<aside>Aside</aside><br>
<footer>Footer</footer>
    
</body>
</html>
