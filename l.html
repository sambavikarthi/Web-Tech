<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JobConnect - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #27bcda, #c60f9e);
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-box img {
      width: 60px;
      height: 60px;
      margin-bottom: 10px;
    }

    .login-box h2 {
      margin-bottom: 10px;
      color: #1c1c1c;
    }

    .login-box p {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background-color: #1c92d2;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-box button:hover {
      background-color: #176a9d;
    }

    .welcome-msg {
      margin-top: 20px;
      font-size: 16px;
      background: #e3f2fd;
      padding: 15px;
      border-radius: 10px;
      color: #0d47a1;
      display: none;
    }

    a {
      display: inline-block;
      margin-top: 10px;
      color: #1c92d2;
      text-decoration: none;
      font-size: 14px;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="JobConnect Logo" />
    <h2>Welcome to JobConnect</h2>
    <p>Your gateway to career opportunities</p>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <div class="welcome-msg" id="welcomeMsg"></div>

    <a href="#">Create an account</a><br />
    <a href="#">Forgot password?</a>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value;

      if (user && pass) {
        document.getElementById("loginForm").style.display = "none";
        const msg = document.getElementById("welcomeMsg");
        msg.innerHTML = `👋 Hello <strong>${user}</strong>, welcome to <strong>JobConnect</strong>!`;
        msg.style.display = "block";
      }
    });
  </script>

</body>
</html>
